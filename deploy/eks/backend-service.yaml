#
# ClusterIP for the backend. The ALB ingress registers pod IPs directly
# (target-type: ip), so the health-check annotations here describe the
# backend target group — pointed at Actuator, not the SPA root.
apiVersion: v1
kind: Service
metadata:
  name: ldapportal-backend
  labels:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: backend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
