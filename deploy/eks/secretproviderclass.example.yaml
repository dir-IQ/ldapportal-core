# SPDX-License-Identifier: Apache-2.0
#
# OPTIONAL — recommended production path for secrets. Not referenced by
# kustomization.yaml; apply on its own once the prerequisites are met.
#
# Syncs the four AWS Secrets Manager entries created by the terraform/aws
# module (<name>/encryption-key, /jwt-secret, /bootstrap-superadmin-password,
# /db-password) into a Kubernetes Secret named `ldapportal-secrets` — the
# exact name/shape the backend Deployment already consumes, so nothing else
# changes.
#
# Prerequisites:
#   1. Install the Secrets Store CSI driver + the AWS provider:
#        helm install csi-secrets-store secrets-store-csi-driver/secrets-store-csi-driver \
#          -n kube-system --set syncSecret.enabled=true
#        kubectl apply -f https://raw.githubusercontent.com/aws/secrets-store-csi-driver-provider-aws/main/deployment/aws-provider-installer.yaml
#   2. IRSA: annotate the `ldapportal` ServiceAccount with an IAM role that
#      allows secretsmanager:GetSecretValue on the four secrets
#      (serviceaccount.yaml has the placeholder).
#   3. Mount this SecretProviderClass in the backend pod (a CSI volume) so
#      the driver runs and the synced Secret is created. Add to
#      backend-deployment.yaml:
#        volumes:
#          - name: secrets-store
#            csi:
#              driver: secrets-store.csi.k8s.io
#              readOnly: true
#              volumeAttributes:
#                secretProviderClass: ldapportal-aws-secrets
#        # and a volumeMount at e.g. /mnt/secrets-store (readOnly).
#
# Replace REGION/ACCOUNT_ID and the `<name>/` prefix to match the terraform
# module's `name` input.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ldapportal-aws-secrets
  namespace: ldapportal
spec:
  provider: aws
  parameters:
    region: us-east-1
    objects: |
      - objectName: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ldapportal/encryption-key"
        objectAlias: ENCRYPTION_KEY
      - objectName: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ldapportal/jwt-secret"
        objectAlias: JWT_SECRET
      - objectName: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ldapportal/bootstrap-superadmin-password"
        objectAlias: BOOTSTRAP_SUPERADMIN_PASSWORD
      - objectName: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ldapportal/db-password"
        objectAlias: DB_PASSWORD
  # Materialise a real K8s Secret (syncSecret.enabled=true on the driver)
  # so the Deployment's `envFrom: secretRef` works as-is.
  secretObjects:
    - secretName: ldapportal-secrets
      type: Opaque
      data:
        - objectName: ENCRYPTION_KEY
          key: ENCRYPTION_KEY
        - objectName: JWT_SECRET
          key: JWT_SECRET
        - objectName: BOOTSTRAP_SUPERADMIN_PASSWORD
          key: BOOTSTRAP_SUPERADMIN_PASSWORD
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
