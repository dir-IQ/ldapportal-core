#
# The nginx-served Vue SPA. Static assets plus an /api/v1 proxy fallback
# to the backend Service (see frontend-nginx-configmap.yaml). Binds 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldapportal-frontend
  labels:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ldapportal
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ldapportal
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: ldapportal
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/dir-iq/ldapportal-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Backend upstream for the nginx /api/v1 proxy fallback. The
            # entrypoint envsubsts this into the mounted template. Same
            # namespace, so the short Service name resolves.
            - name: BACKEND_APP
              value: ldapportal-backend
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            # Override only the one template file (subPath) so the rest of
            # the image's nginx config is untouched.
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
      volumes:
        - name: nginx-template
          configMap:
            name: ldapportal-frontend-nginx
