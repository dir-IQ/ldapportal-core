#
# Keep at least one backend pod serving during voluntary disruptions
# (node drains, rollouts).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ldapportal-backend
  labels:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ldapportal
      app.kubernetes.io/component: backend
