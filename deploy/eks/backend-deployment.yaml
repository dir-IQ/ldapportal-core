# SPDX-License-Identifier: Apache-2.0
#
# The Spring Boot backend (community-plus-isva edition). Binds container
# port 8080 and exposes Spring Actuator at /actuator/health, used for all
# three probes. Flyway runs the schema migration at startup under a DB
# advisory lock, so multiple replicas starting together are safe — the
# generous startupProbe budget covers the migration on a cold database.
#
# NOTE: the GHCR image's ENTRYPOINT pins the JVM heap (-Xms256m -Xmx512m),
# so the memory limit below must stay above ~512Mi of heap plus metaspace,
# threads and direct buffers. To change the heap you must rebuild the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldapportal-backend
  labels:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ldapportal
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ldapportal
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: ldapportal
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/dir-iq/ldapportal-community-plus-isva
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ldapportal-config
            - secretRef:
                name: ldapportal-secrets
          # Startup: allow up to ~5 min (30 × 10s) for Flyway migration +
          # JVM warmup on first boot before liveness/readiness take over.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "640Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
