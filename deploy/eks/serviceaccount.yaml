#
# Shared service account for the backend and frontend pods.
#
# IRSA: if you sync secrets from AWS Secrets Manager via the Secrets Store
# CSI driver (see secretproviderclass.example.yaml), uncomment the
# annotation and point it at an IAM role that allows
# secretsmanager:GetSecretValue on the four ldapportal/* secrets. The app
# itself makes no AWS API calls, so without the CSI driver this SA needs
# no IAM role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ldapportal
  labels:
    app.kubernetes.io/name: ldapportal
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/ldapportal-secrets-reader
