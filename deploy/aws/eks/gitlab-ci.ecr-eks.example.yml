# GitLab CI/CD: build community-plus-isva + frontend, push to AWS ECR, and
# (optionally) deploy to EKS via Kustomize.
#
# This is the ECR/EKS variant of the publish stage in the repo-root
# `.gitlab-ci.yml`, plus a gated `deploy` stage. Two ways to use it in your
# internal fork:
#
#   A) `include:` it from your `.gitlab-ci.yml` and remove the starter's
#      GitLab-Container-Registry `publish-backend`/`publish-frontend` jobs:
#          include:
#            - local: deploy/aws/eks/gitlab-ci.ecr-eks.example.yml
#   B) Copy these jobs into your `.gitlab-ci.yml`, replacing the starter's
#      `publish-*` jobs.
#
# Auth to AWS uses GitLab OIDC (no static keys): create an IAM role trusted by
# your GitLab instance's OIDC provider and set AWS_ROLE_ARN. If you can't use
# OIDC, drop the `.aws-oidc` assume-role line and instead set masked, protected
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY CI/CD variables.
#
# Required CI/CD variables:
#   AWS_REGION     e.g. us-east-1
#   ECR_REGISTRY   <ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com
#   AWS_ROLE_ARN   IAM role for OIDC (ECR push + eks:DescribeCluster + the
#                  cluster RBAC mapping for the deploy job)
#   EKS_CLUSTER    the target EKS cluster name (deploy job only)

stages:
  - package
  - publish
  - deploy

variables:
  # Point at deploy/aws/eks-overlays/prod-webseal for the dual-frontend variant.
  KUSTOMIZE_PATH: "deploy/aws/eks-overlays/prod"

# ── Reusable OIDC → STS helper ───────────────────────────────────────────────
# Exchanges the GitLab-issued ID token for short-lived AWS credentials.
.aws-oidc:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com   # set to your GitLab instance URL / configured audience
  before_script:
    - |
      CREDS=$(aws sts assume-role-with-web-identity \
        --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "gitlab-${CI_PIPELINE_ID}" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | cut -f1)
    - export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | cut -f2)
    - export AWS_SESSION_TOKEN=$(echo "$CREDS" | cut -f3)

# ── package: build the runnable JAR (community-plus-isva only) ────────────────
# The backend Dockerfile COPYs this artifact, so it must exist before publish.
package-backend:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  script:
    - bash scripts/check-addons-license-headers.sh
    - mvn $MAVEN_CLI_OPTS -DskipTests -pl distribution/community-plus-isva -am clean package
  artifacts:
    paths:
      - "distribution/community-plus-isva/target/*.jar"
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'

# ── publish: build + push images to ECR ──────────────────────────────────────
.ecr:
  extends: .aws-oidc
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache aws-cli
    - !reference [.aws-oidc, before_script]
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

publish-backend:
  stage: publish
  extends: .ecr
  needs:
    - job: package-backend
      artifacts: true
  script:
    - IMAGE="$ECR_REGISTRY/ldapportal-community-plus-isva"
    # Build context is the repo root so the Dockerfile COPY can reach
    # distribution/community-plus-isva/target/.
    - docker build -f docker/community-plus-isva/Dockerfile -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'

publish-frontend:
  stage: publish
  extends: .ecr
  needs: []
  script:
    - IMAGE="$ECR_REGISTRY/ldapportal-frontend"
    - docker build -f frontend/Dockerfile -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" frontend
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'

# ── deploy: apply the prod overlay to EKS ─────────────────────────────────────
# Manual gate so a human triggers the rollout after images are pushed. The
# overlay pins images by tag; this job stamps the just-built tag in so the
# cluster pulls exactly this release. Requires the AWS_ROLE_ARN role to be
# mapped in the cluster's access entries / aws-auth to a group allowed to apply.
deploy-eks:
  stage: deploy
  extends: .aws-oidc
  image: alpine/k8s:1.29.10   # bundles kubectl + kustomize + aws-cli
  needs:
    - publish-backend
    - publish-frontend
  script:
    - aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
    # Pin this release's tag into the overlay images, then apply.
    - cd "$KUSTOMIZE_PATH"
    - kustomize edit set image
        "ghcr.io/dir-iq/ldapportal-community-plus-isva=$ECR_REGISTRY/ldapportal-community-plus-isva:$CI_COMMIT_TAG"
        "ghcr.io/dir-iq/ldapportal-frontend=$ECR_REGISTRY/ldapportal-frontend:$CI_COMMIT_TAG"
    - cd "$CI_PROJECT_DIR"
    - kubectl apply -k "$KUSTOMIZE_PATH"
    - kubectl -n ldapportal rollout status deploy/ldapportal-backend --timeout=6m
    - kubectl -n ldapportal rollout status deploy/ldapportal-frontend --timeout=3m
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
      when: manual
  environment:
    name: production
    url: https://ldapportal.example.com
