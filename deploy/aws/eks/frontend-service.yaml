#
# ClusterIP for the SPA. Health-check annotations describe the frontend
# ALB target group (the SPA root returns 200).
apiVersion: v1
kind: Service
metadata:
  name: ldapportal-frontend
  labels:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: frontend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
