#
# TEMPLATE ONLY — do not commit a filled-in copy, and note this file is
# NOT referenced by kustomization.yaml. Create the real secret out of band
# so plaintext credentials never enter git. Two options:
#
#   A) Generate + apply directly (simplest):
#        kubectl create secret generic ldapportal-secrets -n ldapportal \
#          --from-literal=ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#          --from-literal=JWT_SECRET="$(openssl rand -base64 64)" \
#          --from-literal=BOOTSTRAP_SUPERADMIN_PASSWORD="$(openssl rand -base64 24)" \
#          --from-literal=DB_PASSWORD="<your RDS master password>"
#
#   B) Sync from AWS Secrets Manager via the Secrets Store CSI driver —
#      see secretproviderclass.example.yaml. The CSI driver materialises a
#      Secret of this same name/shape, so the Deployment is unchanged.
#
# The Deployment consumes these as env via `envFrom: secretRef`, so each
# key name below is the exact environment variable the app reads.
apiVersion: v1
kind: Secret
metadata:
  name: ldapportal-secrets
  namespace: ldapportal
  labels:
    app.kubernetes.io/name: ldapportal
type: Opaque
stringData:
  # 32-byte AES-256 key, base64. `openssl rand -base64 32`
  # WARNING: rotating this without re-encrypting stored directory bind
  # passwords locks out every directory. See docs/deployment-eks.md.
  ENCRYPTION_KEY: "REPLACE_WITH_BASE64_32_BYTE_KEY"
  # Long random HMAC secret, base64. `openssl rand -base64 64`
  JWT_SECRET: "REPLACE_WITH_LONG_RANDOM_SECRET"
  # First-superadmin temp password (inert after first local superadmin exists).
  BOOTSTRAP_SUPERADMIN_PASSWORD: "REPLACE_WITH_STRONG_TEMP_PASSWORD"
  # Postgres password for DB_USERNAME (the RDS master/app user).
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
