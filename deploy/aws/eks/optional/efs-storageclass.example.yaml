# SPDX-License-Identifier: Apache-2.0
#
# OPTIONAL, DEV/TEST ONLY — a working EFS StorageClass for the in-cluster
# Postgres in postgres-dev.yaml, for clusters that have the EFS CSI driver
# (efs.csi.aws.com) but NOT the EBS CSI driver. Without a StorageClass that
# names a real fileSystemId, the dev Postgres PVC stays Pending forever
# ("Failed to resolve filesystem Id ... must be specified").
#
# NOT for production. EFS is NFS; Postgres on NFS carries fsync/locking
# risk. Prefer managed RDS (see configmap.yaml) or EBS-backed gp2/gp3 with
# the aws-ebs-csi-driver addon for anything real.
#
# EDIT BEFORE APPLYING:
#   fileSystemId → your EFS filesystem id (fs-xxxxxxxx), in the cluster VPC.
#     aws efs describe-file-systems --query 'FileSystems[].FileSystemId'
#
# AWS-side prerequisites (otherwise the PVC hangs or provisioning is denied):
#   1. The EFS filesystem has mount targets in the subnets your nodes run in.
#   2. Those mount targets' security group allows inbound NFS (TCP 2049)
#      from the node/pod security group.
#   3. The EFS CSI controller's IAM role can create access points
#      (elasticfilesystem:CreateAccessPoint / DescribeAccessPoints /
#      DeleteAccessPoint / DescribeFileSystems / DescribeMountTargets).
#
# Apply on its own, then point postgres-dev.yaml at it by setting, under
# volumeClaimTemplates[].spec:
#   storageClassName: efs-ldapportal
# Because a StatefulSet PVC's storageClassName is immutable, delete any
# existing PVC first:
#   kubectl -n <ns> delete statefulset ldapportal-db --cascade=orphan
#   kubectl -n <ns> delete pvc data-ldapportal-db-0
#   kubectl -n <ns> apply -f deploy/aws/eks/optional/postgres-dev.yaml
#
# Two EFS-specific prerequisites the backing manifest/network otherwise miss:
#   - The postgres container must run as uid/gid 999 (the access-point owner),
#     or its root entrypoint crash-loops on "chown ... Operation not permitted".
#     Uncomment the securityContext block in postgres-dev.yaml.
#   - The EFS mount target's security group must allow inbound NFS (TCP 2049)
#     from the node/pod security group, or the pod hangs on MountVolume.SetUp
#     with "context deadline exceeded".
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-ldapportal
  labels:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: database
provisioner: efs.csi.aws.com
parameters:
  # Dynamically create one EFS access point per PVC.
  provisioningMode: efs-ap
  fileSystemId: fs-REPLACE_WITH_EFS_ID
  directoryPerms: "700"
  # The access-point POSIX owner. Must match what the Postgres image writes
  # its data directory as, or the container fails with "data directory ...
  # has wrong ownership". These align with the fsGroup: 999 set on the
  # StatefulSet pod in postgres-dev.yaml. If the pod crash-loops on an
  # ownership/permission error, read `kubectl logs ldapportal-db-0`, adjust
  # uid/gid to the uid the image actually runs as, then recreate the PVC
  # (access-point parameters are fixed at creation time).
  uid: "999"
  gid: "999"
# EFS is not AZ-bound, so there is no benefit to WaitForFirstConsumer.
reclaimPolicy: Delete
volumeBindingMode: Immediate
