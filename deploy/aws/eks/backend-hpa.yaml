#
# CPU-based autoscaling for the backend. Requires metrics-server in the
# cluster (an EKS add-on). Delete this file (and drop it from
# kustomization.yaml) if you pin a fixed replica count instead.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ldapportal-backend
  labels:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ldapportal-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
