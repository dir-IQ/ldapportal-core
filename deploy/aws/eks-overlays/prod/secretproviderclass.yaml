# SPDX-License-Identifier: Apache-2.0
#
# Syncs the four AWS Secrets Manager entries into a Kubernetes Secret named
# `ldapportal-secrets` — the exact name/shape the backend Deployment already
# consumes via `envFrom: secretRef`, so nothing else changes. The Secret is
# materialised only when a pod mounts this SecretProviderClass as a CSI
# volume (see backend-csi-patch.yaml).
#
# Prerequisites (one-time, cluster-wide):
#   1. Secrets Store CSI driver + AWS provider installed, with
#      syncSecret.enabled=true (see docs/deployment-eks.md §1).
#   2. IRSA: the `ldapportal` ServiceAccount annotated with a role allowing
#      secretsmanager:GetSecretValue on the four secrets
#      (serviceaccount-patch.yaml).
#
# EDIT: region, the ACCOUNT_ID in each ARN, and the `ldapportal/` prefix if
# your Secrets Manager names differ.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ldapportal-aws-secrets
  namespace: ldapportal
spec:
  provider: aws
  parameters:
    region: us-east-1
    objects: |
      - objectName: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ldapportal/encryption-key"
        objectAlias: ENCRYPTION_KEY
      - objectName: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ldapportal/jwt-secret"
        objectAlias: JWT_SECRET
      - objectName: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ldapportal/bootstrap-superadmin-password"
        objectAlias: BOOTSTRAP_SUPERADMIN_PASSWORD
      - objectName: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ldapportal/db-password"
        objectAlias: DB_PASSWORD
  # Materialise a real K8s Secret (needs syncSecret.enabled=true on the driver)
  # so the Deployment's `envFrom: secretRef` works unchanged.
  secretObjects:
    - secretName: ldapportal-secrets
      type: Opaque
      data:
        - objectName: ENCRYPTION_KEY
          key: ENCRYPTION_KEY
        - objectName: JWT_SECRET
          key: JWT_SECRET
        - objectName: BOOTSTRAP_SUPERADMIN_PASSWORD
          key: BOOTSTRAP_SUPERADMIN_PASSWORD
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
