# SPDX-License-Identifier: Apache-2.0
#
# Annotates the shared `ldapportal` ServiceAccount with the IRSA role that
# allows secretsmanager:GetSecretValue on the four ldapportal/* secrets, so
# the Secrets Store CSI driver can read them. Create the role first (see
# README.md / docs/deployment-eks-gitlab-ecr.md §4.1).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ldapportal
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ldapportal-secrets-reader
