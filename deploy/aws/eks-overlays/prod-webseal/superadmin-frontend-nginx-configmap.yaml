# SPDX-License-Identifier: Apache-2.0
#
# nginx template for the SUPERADMIN frontend (NOT behind WebSEAL). This is the
# break-glass LOCAL-auth path. It STRIPS any inbound iv-* header before
# proxying to the backend, so even though this pod's peer IP is inside the
# Trusted Proxies CIDR (it shares the pod subnet with the admin frontend), a
# client that forges `iv-user` against sa.example.com cannot have it reach the
# backend. The strip is the trust guarantee for the "iv-* strip only" peer-IP
# model — do not remove it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldapportal-frontend-superadmin-nginx
  labels:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: frontend-superadmin
data:
  default.conf.template: |
    server {
        listen 8080;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 50m;

        location /api/v1 {
            proxy_pass http://${BACKEND_APP}:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Defence-in-depth: this path must never carry a WebSEAL identity.
            proxy_set_header iv-user "";
            proxy_set_header iv-groups "";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
