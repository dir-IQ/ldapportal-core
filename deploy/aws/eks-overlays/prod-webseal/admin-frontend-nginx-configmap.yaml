# SPDX-License-Identifier: Apache-2.0
#
# nginx template for the ADMIN frontend (behind the WebSEAL junction). The
# external WebSEAL junction terminates IdP auth and injects iv-user/iv-groups
# upstream of this pod; nginx forwards client request headers to the upstream
# by default, so the WebSEAL-set iv-user reaches the backend unchanged. The
# backend trusts it only because this pod's peer IP is within the configured
# Trusted Proxies AND the iv-user names a WEBSEAL-typed account.
#
# Do NOT strip iv-* here — that is the admin SSO path. Stripping happens only
# on the superadmin variant.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldapportal-frontend-admin-nginx
  labels:
    app.kubernetes.io/name: ldapportal
    app.kubernetes.io/component: frontend-admin
data:
  default.conf.template: |
    server {
        listen 8080;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 50m;

        location /api/v1 {
            proxy_pass http://${BACKEND_APP}:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # iv-user / iv-groups are NOT set here — nginx forwards the
            # WebSEAL-injected request headers to the backend by default.
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
