# ─────────────────────────────────────────────────────────────────────────────
# LDAPPortal desired-state (non-secret). Secrets live in vault.yml — see
# vault.example.yml. Edit to taste, then run ldapportal-iac.yml.
# ─────────────────────────────────────────────────────────────────────────────

ldapportal_base_url: "https://ldapportal.example.com"
ldapportal_validate_certs: true

# ── Provisioning-profile UUIDs ───────────────────────────────────────────────
# Admin profile roles reference provisioning profiles by UUID (the one IaC
# resource without a stable slug yet). Resolve these once from the API and pin
# them here; the admin entries below reference them with Jinja.
ldapportal_profiles:
  corp_users: "00000000-0000-0000-0000-000000000000"   # <-- replace with a real id

# ── Directories ──────────────────────────────────────────────────────────────
# Each entry IS the directory request body (the bind password is injected from
# the vault on first create — see the playbook). `port`, `pool*`, `enabled`,
# etc. are sent explicitly because the API record has primitive fields that
# default to 0/false when omitted (and port:0 fails validation).
ldapportal_directories:
  - slug: corp-ldap
    displayName: "Corp OpenLDAP"
    directoryType: GENERIC
    host: ldap.corp.example.com
    port: 636
    sslMode: LDAPS
    trustAllCerts: false
    bindDn: "cn=svc-ldapportal,ou=Service Accounts,dc=corp,dc=example,dc=com"
    baseDn: "dc=corp,dc=example,dc=com"
    pagingSize: 500
    poolMinSize: 2
    poolMaxSize: 20
    poolConnectTimeoutSeconds: 10
    poolResponseTimeoutSeconds: 30
    enabled: true
    selfServiceEnabled: false
    replicationEnabled: false
    userBaseDns:
      - { dn: "ou=People,dc=corp,dc=example,dc=com", displayOrder: 0 }
    groupBaseDns:
      - { dn: "ou=Groups,dc=corp,dc=example,dc=com", displayOrder: 0 }

# ── Admin accounts (+ permissions) ───────────────────────────────────────────
# profileRoles + featurePermissions are FULL-REPLACE: anything not listed here
# is removed on apply. LOCAL passwords are injected from the vault on first
# create only (preserved thereafter).
ldapportal_admins:
  - account:
      username: jdoe
      role: ADMIN
      authType: LOCAL
      displayName: "Jane Doe"
      email: jane.doe@example.com
      active: true
    profileRoles:
      - profileId: "{{ ldapportal_profiles.corp_users }}"
        baseRole: ADMIN
    featurePermissions:
      - { featureKey: "user.create",         enabled: true }
      - { featureKey: "user.reset_password", enabled: true }
      - { featureKey: "group.manage_members", enabled: true }

# ── ISVA vendor config (requires the VENDOR_INTEGRATIONS_ISVA entitlement) ────
# `config` IS the request body; the directory is addressed by its slug.
ldapportal_isva:
  - directory_slug: corp-ldap
    config:
      enabled: true
      topologyMode: INLINE
      secAuthority: Default
      defaultValidUntilYears: 100
      deletePolicy: DISABLE
      requireSecGroup: true

# ── Automation API tokens ────────────────────────────────────────────────────
# Managed by the `tokens` play (which logs in as a SUPERADMIN — API tokens
# cannot manage other tokens). The one-time plaintext of a newly created token
# is printed once; store it in the vault as ldapportal_api_token.
ldapportal_api_tokens:
  - name: ci-automation
    description: "CI/CD provisioning token"
    expiresAt: "2027-06-05T00:00:00Z"
