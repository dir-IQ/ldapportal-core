# Valve-Guard broker — prototype config.
# Anonymous access on the LAN for the bench phase. Before leaving this running
# long-term, create a passwd file (mosquitto_passwd -c passwd valveguard),
# mount it, and flip the two lines below.
listener 1883
allow_anonymous true
#allow_anonymous false
#password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
# Retained per-zone reports are the fleet's shared logbook — persistence keeps
# them across broker restarts.
