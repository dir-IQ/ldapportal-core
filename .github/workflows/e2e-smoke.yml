# E2E Smoke — Playwright @smoke suite against the real assembled backend.
#
# The backend is the community-plus-isva distribution booted via
# `spring-boot:test-run` (see distribution/community-plus-isva/src/test/java/
# com/ldapportal/e2e/): Testcontainers supplies throwaway Postgres + OpenLDAP,
# Flyway runs the real migrations, and an ApplicationRunner seeds the
# "E2E LDAP (auto)" directory the specs discover. Playwright's webServer
# config (frontend/playwright.config.ts) starts both the backend (through
# frontend/scripts/run-e2e-server.mjs) and the Vite dev server; this workflow
# just prepares the toolchain so those startups fit their timeouts.
#
# The `E2E Smoke` job name is load-bearing: it's on the branch-protection
# required-checks list and dependabot-automerge waits on it. The changes
# guard mirrors ci.yml — docs-only PRs report the job as "skipped", which
# branch protection treats as passing (see ci.yml for the full rationale).

name: E2E Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        uses: actions/github-script@v7
        with:
          script: |
            // Push events: always run (main is the canonical green signal).
            if (context.eventName === 'push') {
              core.setOutput('code', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // The E2E stack spans backend + frontend + workflows, so anything
            // that isn't docs-only is relevant. Same docs filter as ci.yml.
            const docsOnly = /^(docs\/|stale-docs\/|\.claude\/)|\.md$/;
            const code = files.some((f) => !docsOnly.test(f.filename));
            core.setOutput('code', code ? 'true' : 'false');
            core.notice(`code=${code} (${files.length} files in PR)`);

  e2e-smoke:
    name: E2E Smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Pre-pull Testcontainers images
        # Keeps first-time image pulls out of Playwright's 180s webServer
        # startup window (playwright.config.ts).
        working-directory: .
        run: |
          docker pull -q postgres:16.13-alpine
          docker pull -q osixia/openldap:1.5.0

      - name: Pre-build backend modules
        # Warms ~/.m2 so run-e2e-server.mjs's own install step is a fast
        # no-op inside the webServer timeout. Runner `mvn` (not ./mvnw) for
        # the same wrapper-bootstrap-403 reason as ci.yml.
        working-directory: .
        run: mvn --batch-mode --no-transfer-progress -DskipTests -pl distribution/community-plus-isva -am install

      - name: Run Playwright @smoke suite
        run: npm run e2e:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
