# A11y — runtime axe-core (WCAG 2.1 AA) gate over the authenticated pages.
#
# Runs the Playwright @a11y suite (frontend/tests/e2e/spec/a11y.spec.ts),
# which needs the real backend for auth cookies + API data — same
# Testcontainers harness as e2e-smoke.yml. The spec ratchets: known debt
# rules are allowlisted (see ACCEPTED_RULES in the spec) so the gate is green
# today and fails only on NEW violation classes. Complements the static
# eslint-plugin-vuejs-accessibility lint in ci.yml.

name: A11y

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        uses: actions/github-script@v7
        with:
          script: |
            // Push events: always run (main is the canonical green signal).
            if (context.eventName === 'push') {
              core.setOutput('code', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Runtime a11y depends on rendered pages + backend data, so
            // anything that isn't docs-only is relevant. Same docs filter
            // as ci.yml.
            const docsOnly = /^(docs\/|stale-docs\/|\.claude\/)|\.md$/;
            const code = files.some((f) => !docsOnly.test(f.filename));
            core.setOutput('code', code ? 'true' : 'false');
            core.notice(`code=${code} (${files.length} files in PR)`);

  a11y:
    name: A11y (runtime axe)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Pre-pull Testcontainers images
        working-directory: .
        run: |
          docker pull -q postgres:16.13-alpine
          docker pull -q osixia/openldap:1.5.0

      - name: Pre-build backend modules
        working-directory: .
        run: mvn --batch-mode --no-transfer-progress -DskipTests -pl distribution/community-plus-isva -am install

      - name: Run Playwright @a11y suite
        run: npm run e2e:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
