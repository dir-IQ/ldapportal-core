# Publishes container images to the GitHub Container Registry (GHCR).
#
# Three images, all driven off a vX.Y.Z tag so the image version always
# matches a release:
#   ghcr.io/<owner>/ldapportal-community
#   ghcr.io/<owner>/ldapportal-community-plus-isva
#   ghcr.io/<owner>/ldapportal-frontend
#
# The backend Dockerfiles (docker/<edition>/Dockerfile) are self-contained
# multi-stage builds — they compile the JAR in an in-image Maven stage, so the
# backend job needs no JDK/Maven on the runner, only Docker/buildx. Build
# context is the repo root so the reactor POMs and .git are reachable. The
# frontend image is a self-contained multi-stage npm build with context frontend/, built
# from frontend/Dockerfile — a portable envsubst-template image whose backend
# host is supplied at runtime via BACKEND_APP (see frontend/nginx.conf.template),
# so the same image runs on compose, Kubernetes/EKS and Fly.io.
#
# Auth: the built-in GITHUB_TOKEN with packages:write — no PAT/secret to
# manage for same-org pushes. metadata-action lowercases the owner, so a
# mixed-case org (dir-IQ) still produces a valid lowercase image ref.
#
# Package visibility: GHCR creates packages PRIVATE on first publish.
# Making them public is a one-time manual step per package
# (Package settings -> Danger Zone -> Change visibility) — it can't be
# done from the workflow before the package exists.
name: Publish images (GHCR)

on:
  push:
    tags: ['v*']
  # Manual runs to exercise the publish path without cutting a release.
  # Manual runs are tagged `manual-<sha>` only — they never produce a
  # version tag and never move `latest`. NOTE: the "Run workflow" button
  # only appears once this file is on the default branch (main); GitHub
  # only surfaces workflow_dispatch for workflows present there.
  workflow_dispatch: {}

# Least-privilege: read the repo, write packages. No other scopes.
permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend image (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [community, community-plus-isva]
    steps:
      # fetch-depth 0 so git-commit-id-maven-plugin — run inside the image's
      # Maven build stage — can resolve the HEAD short-SHA it bakes into
      # build-info.properties. The JAR is compiled in-image (the -am reactor
      # builds community -> core; community-plus-isva -> core + addons/isva, and
      # the distribution module's verify-no-ee-bytecode check keeps it
      # license-clean), so no JDK/Maven is set up on the runner.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ldapportal-${{ matrix.edition }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=manual-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.edition }}/Dockerfile
          push: true
          # Bake the release version into the image so the running app can
          # report it (VersionController /version -> sidebar build stamp).
          # meta.outputs.version is the primary tag (e.g. 1.4.2 on a v1.4.2
          # push, manual-<sha> on a workflow_dispatch), so a pull of latest
          # or vX.Y.Z reports the real release version, not "latest".
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Persist the Maven-dependency + base layers across runs (per edition),
          # replacing the setup-java `cache: maven` we dropped when the JAR build
          # moved into the image's build stage.
          cache-from: type=gha,scope=backend-${{ matrix.edition }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.edition }}

  frontend:
    name: Frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ldapportal-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=manual-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
