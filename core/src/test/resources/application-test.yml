spring:
  datasource:
    url: jdbc:h2:mem:ldapportal-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # `create`, not `create-drop`: every test context shares this one
      # in-memory database (DB_CLOSE_DELAY=-1), and Spring's test-context cache
      # closes its least-recently-used context once it holds 32. With
      # create-drop that close dropped the whole shared schema, so whichever
      # still-cached context ran next found "Table … not found (this database
      # is empty)" — which tests broke depended on how many contexts the suite
      # had. `create` still rebuilds the schema when a context starts; nothing
      # drops it when one closes.
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  encryption:
    key: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleTA=
  bootstrap:
    superadmin:
      username: admin
      password: test-bootstrap-pw
  jwt:
    secret: dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGVzdHNlY3JldHRlc3Q=
    expiry-minutes: 60
  cookie:
    secure: false
